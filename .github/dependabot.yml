# Renovate owns update PRs; routine Dependabot version PRs are disabled.
# Keep GitHub vulnerability alerts enabled. Automatic security PRs are a separate repo setting.
---
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/New_York
    target-branch: main
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - automated
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      vercel:
        patterns:
          - '@vercel/*'
      all-other:
        patterns:
          - '*'
        exclude-patterns:
          - '@opentelemetry/*'
          - '@vercel/*'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    labels:
      - ci
      - automated
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 0
